<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  text-align:center;
  overflow:hidden;
}

/* VIDEO */
.bg-video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.3));
  z-index:-1;
}

/* BOX */
.content{
  position:relative;
  z-index:10;
  max-width:400px;
  padding:25px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  animation:fadeUp 1s ease forwards;
}

h1{font-size:24px;margin-bottom:10px}
p{font-size:14px;opacity:.9}

.cta{
  display:block;
  margin-top:20px;
  padding:14px;
  background:#ff0050;
  color:#fff;
  font-weight:bold;
  border-radius:10px;
  text-decoration:none;
  font-size:16px;
  animation:pulse 2s infinite;
}

.bottom-bar{
  position:fixed;
  bottom:0;
  width:100%;
  padding:15px;
  background:rgba(0,0,0,0.9);
}

.bottom-bar a{
  display:block;
  background:#22c55e;
  padding:15px;
  border-radius:8px;
  color:#000;
  font-weight:bold;
  text-decoration:none;
}

.timer{margin-top:10px;font-size:13px;color:#facc15}

/* ANIMASI */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
